# Konfigurasi database demo. Kredensial diambil dari environment variable.
spring.datasource.url=jdbc:h2:file:./data/ticketing
spring.datasource.username=${TICKETING_DB_USER}
spring.datasource.password=${TICKETING_DB_PASSWORD}
spring.sql.init.mode=always
server.error.include-message=never
server.error.include-stacktrace=never
